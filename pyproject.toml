[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signus"
version = "2.0.0"
description = "Blind PSK/QAM demodulator: auto parameter detection + constellation UI"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
# Optional JIT for the sequential equalizer/carrier loops (16-34x on those loops).
# Falls back to identical pure-numpy when absent. NOTE: numba pins numpy<2.5.
fast = ["numba>=0.60"]

[project.scripts]
signus = "signus.cli:main"

[tool.setuptools.packages.find]
include = ["signus*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = ["stretch: slow/marginal cases, opt-in"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
